[package]
name = "lyric-overlay"
version = "0.44.0"
description = "Beat-aware synced lyric overlay for Windows (Tauri)"
authors = ["Dhruv Choudhary"]
license = "MIT"
repository = "https://github.com/Dhruvch1244/lyric-viewer"
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The app is the workspace root; the inference sidecar (Phase 3) is a second
# binary that must NOT be linked into it — that separation is the whole point
# (JOB-ENGINE section 2.2: an ORT segfault or OOM takes the sidecar down, not
# the app, and the OS reclaims its memory on exit). `protocol` is the message
# definition both sides share so their wire formats cannot drift apart.
[workspace]
members = ["protocol", "sidecar"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `store` compiles out the GitHub self-updater. The Microsoft Store build ships
# as a read-only MSIX that the Store updates itself, so bundling the updater
# there would only produce a broken "update available" path. See docs/MICROSOFT-STORE.md.
store = []

# Optimised release build. LTO + a single codegen unit trade compile time for a
# smaller, faster binary; strip drops debug symbols. Unwinding is kept (no
# panic="abort") so a panic inside a command fails that call instead of aborting
# the whole app — the IPC layer catches it.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Message definitions shared with the inference sidecar. Note what is NOT here:
# `ort`. The app never links ONNX Runtime — that is the isolation the sidecar
# exists to provide (JOB-ENGINE section 2.2).
inference-protocol = { path = "protocol" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Job engine (src/jobs). Only the sync primitives — the runtime itself is
# Tauri's (`tauri::async_runtime`), which is this same tokio, so the versions
# unify and nothing extra is pulled in.
tokio = { version = "1", features = ["sync", "macros"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
ureq = { version = "2.10", features = ["json"] }
regex = "1"
base64 = "0.22"
# FFT for the native WASAPI loopback path (see audio.rs): the capture thread
# turns raw PCM into the same byte-spectrum a Web Audio AnalyserNode would, so
# the renderer's tuned DSP needs no change.
rustfft = "6"
# Native audio decode for offline per-song analysis. mp3/aac/isomp4 are added on
# top of the default open codecs (flac/wav/ogg/vorbis) so local files of any
# common format decode without the renderer's Web Audio pass.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
# Verifies downloaded ONNX models (models.rs) against a pinned SHA-256 —
# pure Rust, no system OpenSSL, consistent with everything else here.
sha2 = "0.10"
# Chromaprint audio fingerprints for track identification (fingerprint.rs,
# JOB-ENGINE section 5.1). A pure-Rust port, so Windows needs no C toolchain
# and no chromaprint DLL beside the exe — the same reasoning that picked
# `sha2` over system OpenSSL. It also carries `FingerprintCompressor`, which
# is the part AcoustID actually needs: raw u32 fingerprints are useless to the
# API without its compression format.
rusty-chromaprint = "0.3"
# EBU R128 integrated loudness (loudness.rs, JOB-ENGINE section 5.6). The
# reference implementation rather than a re-derivation: K-weighting
# coefficients and two-stage gating are fiddly, published, and produce a
# plausible-looking number when subtly wrong. Pure Rust by default — the `cc`
# feature is opt-in and not enabled.
ebur128 = "0.1"
# The job journal and the lyric/track index (JOB-ENGINE section 4).
# `bundled` compiles SQLite from source, adding no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    # WinRT: native "now playing" (SMTC), replacing the PowerShell 5.1 poller.
    "Media_Control",
    "Foundation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    # DwmGetWindowAttribute(DWMWA_CLOAKED) — occlusion detection for the P2
    # power watcher (a window can be cloaked without being minimized, e.g.
    # after a virtual-desktop switch).
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    # SetThreadPriority: the job engine's CPU/inference lanes run below normal
    # so the compositor and render thread always win (see jobs/pool.rs).
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
] }
