[package]
name = "lyric-overlay"
version = "0.25.0"
description = "Beat-aware synced lyric overlay for Windows (Tauri)"
authors = ["Dhruv Choudhary"]
license = "MIT"
repository = "https://github.com/Dhruvch1244/lyric-viewer"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
ureq = { version = "2.10", features = ["json"] }
regex = "1"
