name: release

# Build + publish the Tauri app for Windows, macOS and Linux whenever a v* tag
# is pushed. tauri-action compiles each platform on its own runner, signs the
# updater artifacts, and uploads everything (installers + latest.json) to a
# GitHub release. Whisper is vendored automatically via the beforeBuildCommand
# in tauri.conf.json.
#
# NOTE on parity: the Windows-only features (SMTC now-playing, wallpaper mode,
# the WASAPI-bound bits) are cfg-gated, so the macOS/Linux builds compile and
# run — they just don't have those OS integrations yet (MediaRemote / MPRIS /
# desktop-wallpaper equivalents are a follow-on). The visuals, lyrics, artwork
# and LLM features work everywhere.
#
# NOTE on releaseDraft (below): every release lands as a GitHub DRAFT, on
# purpose — a chance to check the notes before anyone sees them. But GitHub
# excludes drafts from /releases/latest and its API, which is what the
# website's download buttons and version chip read. A tag that's built but
# never manually published leaves the site silently serving the previous
# release. After a build finishes: review it in the GitHub UI, then either
# click "Publish release" there, or run
# `gh release edit <tag> --repo Dhruvch1244/lyric-viewer --draft=false`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows alone bundles the inference sidecar, via the bundle-time
          # config overlay. See the "inference sidecar" note below for why it
          # is per-platform and why the overlay is not in the base config.
          # The path is repo-root-relative, not relative to src-tauri: the CLI
          # resolves --config against the project root it detects (where
          # package.json is), so a bare filename fails with "cannot find the
          # file specified" — which is what `npm run tauri:build` had been
          # doing, unnoticed, since the overlay was introduced.
          - platform: windows-latest
            args: '--config src-tauri/tauri.bundle.conf.json'
            sidecar: true
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install npm dependencies
        # npm install (not npm ci) so a version bump that hasn't refreshed the
        # lockfile doesn't fail the in-sync check — this pipeline only needs the
        # JS deps present for the vendor:whisper step, not byte-for-byte pinning.
        run: npm install

      # The inference sidecar (src-tauri/sidecar) — native Whisper + Silero
      # VAD, and everything that hangs off them: word-level timing, the
      # crash-safe transcription journal, and AcoustID identification, which
      # runs on the transcription path. Without this step the bundle ships
      # without it, `inference::available()` is false, and all of that silently
      # falls back to the WebView Whisper path — a degraded build, not a broken
      # one, which is exactly why it could go unnoticed.
      #
      # Windows only, and deliberately: the sidecar is staged per target triple
      # and macOS here builds `universal-apple-darwin`, which is two of them.
      # The Windows-only OS integrations (SMTC, WASAPI loopback) are what feed
      # it in the first place. `tauri-build` fails at cargo-check time if a
      # declared `externalBin` is missing, so the overlay and this step have to
      # travel together — which is why the overlay is in `args` above rather
      # than in the base config.
      - name: Build the inference sidecar
        if: matrix.sidecar
        run: npm run vendor:sidecar

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Add these two as repo secrets (the private key is at
          # ~/.tauri/lyric-overlay.key on the dev machine; the password is empty).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lyric Overlay ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
