name: release

# Build + publish the Tauri app for Windows, macOS and Linux whenever a v* tag
# is pushed. tauri-action compiles each platform on its own runner, signs the
# updater artifacts, and uploads everything (installers + latest.json) to a
# GitHub release. Whisper is vendored automatically via the beforeBuildCommand
# in tauri.conf.json.
#
# NOTE on parity: the Windows-only features (SMTC now-playing, wallpaper mode,
# the WASAPI-bound bits) are cfg-gated, so the macOS/Linux builds compile and
# run — they just don't have those OS integrations yet (MediaRemote / MPRIS /
# desktop-wallpaper equivalents are a follow-on). The visuals, lyrics, artwork
# and LLM features work everywhere.
#
# NOTE on releaseDraft (below): every release lands as a GitHub DRAFT, on
# purpose — a chance to check the notes before anyone sees them. But GitHub
# excludes drafts from /releases/latest and its API, which is what the
# website's download buttons and version chip read. A tag that's built but
# never manually published leaves the site silently serving the previous
# release. A manual run publishes it automatically once everything is green
# (the `publish` input, on by default); a pushed tag stays a draft — review it
# in the GitHub UI, then click "Publish release", or dispatch publish.yml.

on:
  push:
    tags:
      - 'v*'
  # A manual run with `tag` set is a full release, the same as pushing that
  # tag: tauri-action creates the draft release for it, and GitHub creates the
  # tag itself (on the commit this ran from) when the draft is published. For
  # environments that can push branches but not tags. Without `tag` it is a
  # dry run: everything builds, nothing is published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.54.0 (empty = build only)'
        required: false
        default: ''
      # One step from "release" to live: after every job is green, attach
      # SHA256SUMS and publish the draft (the `publish` job below). Off, it
      # stays a draft for review, as a pushed tag always does.
      publish:
        description: 'Publish the release once every build is green'
        type: boolean
        required: false
        default: true

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows alone bundles the inference sidecar, via the bundle-time
          # config overlay. See the "inference sidecar" note below for why it
          # is per-platform and why the overlay is not in the base config.
          # The path is repo-root-relative, not relative to src-tauri: the CLI
          # resolves --config against the project root it detects (where
          # package.json is), so a bare filename fails with "cannot find the
          # file specified" — which is what `npm run tauri:build` had been
          # doing, unnoticed, since the overlay was introduced.
          - platform: windows-latest
            args: '--config src-tauri/tauri.bundle.conf.json'
            sidecar: true
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install npm dependencies
        # npm install (not npm ci) so a version bump that hasn't refreshed the
        # lockfile doesn't fail the in-sync check — this pipeline only needs the
        # JS deps present for the vendor:whisper step, not byte-for-byte pinning.
        run: npm install

      # The inference sidecar (src-tauri/sidecar) — native Whisper + Silero
      # VAD, and everything that hangs off them: word-level timing, the
      # crash-safe transcription journal, and AcoustID identification, which
      # runs on the transcription path. Without this step the bundle ships
      # without it, `inference::available()` is false, and all of that silently
      # falls back to the WebView Whisper path — a degraded build, not a broken
      # one, which is exactly why it could go unnoticed.
      #
      # Windows only, and deliberately: the sidecar is staged per target triple
      # and macOS here builds `universal-apple-darwin`, which is two of them.
      # The Windows-only OS integrations (SMTC, WASAPI loopback) are what feed
      # it in the first place. `tauri-build` fails at cargo-check time if a
      # declared `externalBin` is missing, so the overlay and this step have to
      # travel together — which is why the overlay is in `args` above rather
      # than in the base config.
      - name: Build the inference sidecar
        if: matrix.sidecar
        run: npm run vendor:sidecar

      # This version's CHANGELOG section becomes the release body, which
      # tauri-action also writes into latest.json as `notes` — what the in-app
      # update card summarises. It used to be a fixed "See CHANGELOG.md".
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${RELEASE_TAG#v}"
          [ -n "$ver" ] || ver="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)"
          notes="$(awk -v v="$ver" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md for details."
          {
            echo 'body<<LYRIC_NOTES_EOF'
            printf '%s\n' "$notes"
            echo 'LYRIC_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. Add these two as repo secrets (the private key is at
          # ~/.tauri/lyric-overlay.key on the dev machine; the password is empty).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Lyric Overlay ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Native Arch Linux package (packaging/arch/PKGBUILD), attached to the same
  # draft release. Built in an archlinux container rather than on the Ubuntu
  # runner so it links Arch's own webkit2gtk-4.1/GTK, not 22.04's — the .deb
  # and AppImage above already cover "runs anywhere"; this is the one pacman
  # installs and upgrades. Runs alongside `build`, not after it: the ~11
  # minute makepkg used to start only once the slowest platform finished.
  # Attaching it to the release is the separate `arch-release` job below,
  # because that is the only part that needs tauri-action's draft to exist.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      # git before checkout, or actions/checkout falls back to a REST tarball
      # with no .git — and `git archive` below needs the repository.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust nodejs npm \
            webkit2gtk-4.1 gtk3 libayatana-appindicator dbus hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Build package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A release packages its tag's version; a build-only dispatch
          # packages whatever version the tree declares.
          if [ -n "$RELEASE_TAG" ]; then
            ver="${RELEASE_TAG#v}"
          else
            ver="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' src-tauri/tauri.conf.json)"
          fi
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=$ver/" PKGBUILD
          # Pre-seed the source tarball so makepkg builds this exact checkout
          # instead of downloading GitHub's tag archive.
          git -C "$GITHUB_WORKSPACE" archive --prefix="lyric-viewer-$ver/" \
            -o "$PWD/lyric-overlay-$ver.tar.gz" HEAD
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder:builder .
          sudo -u builder makepkg --noconfirm

      # Sign the package with the updater key, so the app's own updater
      # (distro_update.rs) can verify it exactly like every other platform's
      # update, and build a one-package pacman repository so `pacman -Syu`
      # picks up new releases (README: "Arch Linux").
      - name: Sign and index the package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd packaging/arch
          pkg="$(ls *.pkg.tar.zst)"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # The tauri CLI makepkg's build just installed, the same signer
            # tauri-action uses for the other platforms.
            cli="$(ls -d src/lyric-viewer-*/node_modules/.bin/tauri)"
            "$cli" signer sign "$pkg"
            test -s "$pkg.sig"
          else
            echo "::warning::no signing key; the in-app updater will refuse this package"
          fi
          repo-add lyric-overlay.db.tar.gz "$pkg"
          # GitHub release assets cannot be symlinks; pacman fetches the
          # plain names, so make them real copies.
          for f in lyric-overlay.db lyric-overlay.files; do
            cp --remove-destination "$(readlink -f "$f")" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lyric-overlay-arch
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/*.pkg.tar.zst.sig
            packaging/arch/lyric-overlay.db*
            packaging/arch/lyric-overlay.files*
          if-no-files-found: error

  # Seconds of work: waits for both the package and tauri-action's draft
  # release, then attaches one to the other. On the Ubuntu runner, which has
  # gh preinstalled.
  arch-release:
    needs: [build, arch]
    if: needs.arch.result == 'success' && (inputs.tag != '' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyric-overlay-arch
          path: arch

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" arch/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The last step of a release: checksums for every file, then publish — the
  # GitHub "Publish release" click, done here once every job above is green
  # (any failure skips it, leaving the draft for a look). Publishing creates
  # the tag and makes this /releases/latest, which the updaters, the pacman
  # repository and the website all read.
  publish:
    needs: [build, arch-release]
    if: inputs.tag != '' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Attach SHA256SUMS
        run: |
          mkdir assets && cd assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
