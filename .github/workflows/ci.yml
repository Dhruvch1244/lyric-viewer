name: ci

# Runs the existing test suites and clippy on every push/PR. Nothing here
# builds an installer — that stays release.yml's job — this just makes sure
# the checked-in tests (152 JS, 45 Rust) and clippy actually run somewhere
# other than a contributor's own machine before code ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install npm dependencies
        run: npm install
      - name: Run test suite
        run: npm test

  rust:
    name: Rust tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same Tauri Linux build deps as release.yml's ubuntu job — the crate
      # pulls in GTK/WebKit bindings even for `cargo test`/`cargo clippy`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      # --workspace, because src-tauri became one in Phase 3: the app, the
      # shared `protocol` crate, and the inference sidecar. Without it cargo
      # touches only the root package and the sidecar ships unlinted and
      # untested — including the integration test that spawns it for real.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace
      # --all-targets, not --lib: `--lib` never compiles `#[cfg(test)]`
      # blocks, so lints inside the test modules went unseen (two were
      # sitting in the tree unnoticed until a local --all-targets run).
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
