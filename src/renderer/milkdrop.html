<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      This frame, and ONLY this frame, allows 'unsafe-eval'.

      MilkDrop presets are not data: they are per-frame and per-vertex equation
      sources, which Butterchurn compiles into JavaScript functions at load
      time. There is no way to run them without eval, and adding 'unsafe-eval'
      to the main overlay page would extend it to every line of code that
      touches network-sourced lyrics, artwork and translations.

      So the engine is isolated here instead. This document loads nothing but
      two vendored MIT bundles and one local driver; it has no network access at
      all (`connect-src 'none'`), no images, no fonts, and it never sees a
      string that came from the network — audio arrives as raw numbers over
      postMessage from the parent, and preset names are chosen from Butterchurn's
      own catalogue.

      That last property survives the 0.21.0 catalogue expansion. Presets now
      also arrive over postMessage as parsed objects, but they are read by main
      from files inside the installed app — the same trust level as the bundles
      below, and the same one they had when they were compiled into them. No
      preset has ever come off the network and none does now.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:;" />
    <title>MilkDrop</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <script src="vendor/butterchurn.min.js"></script>
    <!--
      One pack, 100 presets, resident. The other three bundles are gone: the
      full 1754-preset corpus now ships as files in vendor/presets and is read
      on demand, so parsing 2.3MB of equations at frame startup bought nothing
      but a slower start and a fifth of the catalogue.

      This one stays because it is the floor. If the preset files cannot be
      read — a broken install, a half-copied update — the engine still has
      something to draw rather than a black rectangle where the visuals were.
    -->
    <script src="vendor/butterchurnPresets.min.js"></script>
    <script src="milkdrop-frame.js"></script>
  </body>
</html>
