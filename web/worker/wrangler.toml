name = "lyric-overlay-proxy"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Optional: serve the proxy from your own domain instead of *.workers.dev.
# Requires the zone to be on Cloudflare (it is) and the subdomain proxied
# (orange cloud). Then set LYRICS_BASE in web/demo.js to
# https://lyricoverlay.dhruvchoudhary.com
# [[routes]]
# pattern = "lyricoverlay.dhruvchoudhary.com/api/*"
# zone_name = "dhruvchoudhary.com"

# Optional: only needed for the desktop app's opt-in remote crash reporting
# (see worker.js's header comment for the one-time setup commands). The
# lyrics proxy above works fine without any of this.
# [[kv_namespaces]]
# binding = "CRASH_REPORTS"
# id = "paste-the-id-wrangler-kv-namespace-create-prints-here"

# Optional: only needed for the marketing site's same-origin pageview
# counter (see worker.js's header comment). Counts only, no per-visitor
# identity. Everything else works fine without this.
# [[kv_namespaces]]
# binding = "SITE_STATS"
# id = "paste-the-id-wrangler-kv-namespace-create-prints-here"

# ADMIN_TOKEN is a secret, not a var — shared by /api/crash-reports and
# /api/stats above. Set with:
#   npx wrangler secret put ADMIN_TOKEN
